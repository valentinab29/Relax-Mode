<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relax Mode</title>

    <style>
        body {
            background: #009056;
            color: #222;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            
            /* Centrado en pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor principal para alinear todo verticalmente */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        .alarm {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 0;
            border-bottom: 2px solid #000000;
        }

        .text {
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        /* Texto blanco brillante al activarse */
        .text.active {
            color: #ffffff;
        }

        /* Botón desactivado */
        .switch {
            width: 50px;
            height: 30px;
            background: #444;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Circulito */
        .switch::after {
            content: "";
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        /* Botón activado (amarillo) */
        .switch.active {
            background: #ffe16f;
        }

        .switch.active::after {
            left: 22px;
        }

        /* Estilos para el logo/imagen debajo */
        .logo-relax {
            width: 60px; /* Puedes ajustar el tamaño aquí */
            height: auto;
            margin-top: 15px; /* Separación con la línea superior */
        }
    </style>
</head>

<body>

    <div class="container">
        
        <div class="alarm">
            <div class="text" id="relaxText">
                RELAX MODE
            </div>

            <div class="switch" onclick="activarRelax()"></div>
        </div>

        <!-- AQUÍ PONES TU IMAGEN -->
        <img src="logo.png" alt="Logo Relax" class="logo-relax">

    </div>

    <script>
        function activarRelax() {
            const boton = document.querySelector(".switch");
            const texto = document.querySelector("#relaxText");

            boton.classList.toggle("active");
            texto.classList.toggle("active");
        }
    </script>

</body>
</html>
